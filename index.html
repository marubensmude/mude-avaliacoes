<style>
:root{--bg:#0B0B0B;--card:#141414;--ouro:#C9A45C;--tx:#F4F1EA;--sub:#9A958B;--linha:#2A2722;--erro:#D9826B}
:root[data-theme="light"]{--bg:#0B0B0B}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:"Helvetica Neue",Arial,sans-serif}
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;box-sizing:border-box}
.cx{width:100%;max-width:380px;background:var(--card);border:1px solid var(--linha);border-top:3px solid var(--ouro);padding:36px 28px;box-sizing:border-box}
.mc{font-family:Georgia,serif;letter-spacing:.22em;font-size:20px;text-transform:uppercase}
.mc b{color:var(--ouro);font-weight:400}
.st{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--sub);margin:6px 0 28px}
.rg{width:36px;height:2px;background:var(--ouro);margin-bottom:24px}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);margin-bottom:8px}
input{width:100%;box-sizing:border-box;background:#0B0B0B;border:1px solid var(--linha);color:var(--tx);padding:12px;font-size:15px;outline:none}
input:focus{border-color:var(--ouro)}
button{margin-top:16px;width:100%;background:var(--ouro);color:#0B0B0B;border:0;padding:13px;font-size:12px;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;font-weight:600}
button:disabled{opacity:.6;cursor:wait}
.er{color:var(--erro);font-size:12.5px;min-height:18px;margin-top:12px}
.rd{font-size:10.5px;color:var(--sub);margin-top:22px;line-height:1.5}
</style>

async function abre(raw){
  var key=await crypto.subtle.importKey("raw",raw,"AES-GCM",false,["decrypt"]);
  var pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:u8(IV)},key,u8(CT));
  var ds=new Blob([pt]).stream().pipeThrough(new DecompressionStream("gzip"));
  var html=await new Response(ds).text();
  document.open();document.write(html);document.close();
}
async function deriva(pw){

  return new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt:u8(SALT),iterations:IT,hash:"SHA-256"},base,256));
}
